# ===========================================================
#  股市自動分析設定檔
#  在 GitHub 網頁上修改並 Commit 後，會自動重新執行一次。
#  「#」後面是註解，不影響設定。
# ===========================================================

[watch]
# 關注的台股（股票代號，要加引號）
tw = ["2330", "0050", "2303"]   # 台積電、元大台灣50、聯電

# 關注的美股（Yahoo Finance 代號，要加引號）：AI 供應鏈
us = [
  "NVDA",   # 輝達：AI 伺服器龍頭，牽動廣達、緯創、鴻海
  "TSM",    # 台積電 ADR：直接預估 2330 開盤
  "AVGO",   # 博通：客製 AI 晶片
  "AMD",    # 超微：AI GPU 第二大
  "MSFT",   # 微軟 ┐
  "GOOGL",  # Google│ 四大雲端：AI 資本支出的來源
  "META",   # Meta  │
  "AMZN",   # 亞馬遜┘
]

# 美股指數（費半、那斯達克、S&P 500、道瓊、VIX、美元兌台幣）固定會抓，不用設定。

[ai_tw]
# 台股 AI 概念股：分組列在報表上，盤後依平均漲跌評分（權重見 [weights] ai_tw）。
# 上市、上櫃都可以；組名可以自己取（要加引號），要加減股票直接改清單。
"晶圓代工與封測" = ["2330", "3711"]                          # 台積電、日月光投控
"IC 設計與 ASIC" = ["2454", "3661", "3443", "5274"]          # 聯發科、世芯-KY、創意、信驊（上櫃）
"AI 伺服器組裝"  = ["2317", "2382", "3231", "6669", "2356", "2376"]  # 鴻海、廣達、緯創、緯穎、英業達、技嘉
"散熱與電源"     = ["3017", "3324", "2308"]                  # 奇鋐、雙鴻（上櫃）、台達電
"PCB 與零組件"   = ["2383", "2368", "3037", "2059"]          # 台光電、金像電、欣興、川湖

# ===========================================================
#  計分方式：每個指標依漲跌先評 -2～+2 分，乘上權重後加總，換算成 -100～+100 分。
#  權重填 0 = 不採用這個指標。
# ===========================================================

[weights]
# 盤前（08:00）：預判今天開盤方向
night_futures = 3   # 台指期夜盤漲跌，最直接
sox           = 2   # 費城半導體指數
tsm_adr       = 2   # 台積電 ADR
nasdaq        = 1   # 那斯達克
ai_stocks     = 1   # 上面 us 清單的平均漲跌
vix           = 1   # VIX 恐慌指數，越高越扣分
usdtwd        = 1   # 美元兌台幣，台幣貶值扣分（外資匯出）
# 盤後（15:30）：今天盤勢強弱
taiex_change  = 2   # 加權指數漲跌幅
ai_tw         = 2   # 上面 [ai_tw] 台股 AI 概念股的平均漲跌
ma            = 2   # 收盤是否站上 5 日、20 日均線
volume        = 1   # 量能：放量上漲加分、放量下跌扣分
foreign       = 2   # 外資買賣超
trust         = 1   # 投信買賣超
foreign_streak = 1  # 外資連續買超或賣超的天數

[label]
bullish = 30    # 分數 ≥ 這個值判為「偏多」，≥ 60 為「強烈偏多」
bearish = -30   # 分數 ≤ 這個值判為「偏空」，≤ -60 為「強烈偏空」

# 執行時間不在這裡設定，由 .github/workflows/analyze.yml 的 cron 決定：
#   盤前 08:00（看美股與台指期夜盤）、盤後 15:30（看台股收盤與三大法人）
